{% extends "base.html" %}

{% block content %}
<div class="page-content">
    <a href="{{ url_for('dashboard') }}" class="back-btn">← Back to Dashboard</a>

    <div class="form-container">
        <h2>Create Club</h2>

        <form action="{{ url_for('create_group') }}" method="POST">
            <div class="form-group">
                <label for="name">Club Name</label>
                <input type="text" id="name" name="name" placeholder="Enter club name" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Describe your club"></textarea>
            </div>

            <div class="form-group">
                <label for="genre">Genre</label>
                <select id="genre" name="genre">
                    <option value="">-- Select a genre --</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Non-Fiction">Non-Fiction</option>
                    <option value="Mystery & Thriller">Mystery & Thriller</option>
                    <option value="Romance">Romance</option>
                    <option value="Science Fiction">Science Fiction</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Horror">Horror</option>
                    <option value="Biography & Memoir">Biography & Memoir</option>
                    <option value="History">History</option>
                    <option value="Self-Help">Self-Help</option>
                    <option value="Young Adult">Young Adult</option>
                    <option value="Classic Literature">Classic Literature</option>
                    <option value="Mixed / Any">Mixed / Any</option>
                </select>
            </div>

            <div class="form-group">
                <label for="reading_pace">Reading Pace</label>
                <select id="reading_pace" name="reading_pace">
                    <option value="">-- Select a pace --</option>
                    <option value="Casual (1 book/month)">Casual (1 book/month)</option>
                    <option value="Moderate (2 books/month)">Moderate (2 books/month)</option>
                    <option value="Fast (1 book/week)">Fast (1 book/week)</option>
                    <option value="Intense (2+ books/week)">Intense (2+ books/week)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="current_book">Currently Reading</label>
                <input type="text" id="current_book" name="current_book" placeholder="Enter the book your club is reading (optional)">
            </div>

            <div class="form-group">
                <label for="up_next">Up Next</label>
                <input type="text" id="up_next" name="up_next" placeholder="Next book (optional)">
            </div>

            <div class="form-group">
                <label for="completed_books">Completed Books</label>
                <textarea id="completed_books" name="completed_books" placeholder="One book per line (optional)"></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-full">Create Club</button>
                <a href="{{ url_for('dashboard') }}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
